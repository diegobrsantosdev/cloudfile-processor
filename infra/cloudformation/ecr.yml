AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repositories for Cloudfile Processor API and Worker.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${EnvironmentName}-api"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-api"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${EnvironmentName}-worker"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-worker"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  ApiRepositoryUri:
    Description: ECR URI for the API image
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-ApiRepositoryUri"

  WorkerRepositoryUri:
    Description: ECR URI for the Worker image
    Value: !GetAtt WorkerRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-WorkerRepositoryUri"

  ApiRepositoryArn:
    Description: ECR ARN for the API repository
    Value: !GetAtt ApiRepository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ApiRepositoryArn"

  WorkerRepositoryArn:
    Description: ECR ARN for the Worker repository
    Value: !GetAtt WorkerRepository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WorkerRepositoryArn"