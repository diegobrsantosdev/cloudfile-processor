AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB table for storing file metadata.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:

  ApiFiles:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-files"
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: fieldId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: fieldId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-files"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  FilesTableName:
    Description: DynamoDB table name
    Value: !Ref ApiFiles
    Export:
      Name: !Sub "${AWS::StackName}-FilesTableName"

  FilesTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt ApiFiles.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FilesTableArn"


      # --------------------------
      # Item attributes (for reference)
      # --------------------------
      # userId      : String   -> ID of the user who owns the file (partition key)
      # fileId      : String   -> Unique file ID (sort key)
      # fileName    : String   -> Name of the file
      # fileType    : String   -> File type / MIME type
      # fileSize    : Number   -> File size in bytes
      # uploadDate  : String   -> Upload date/time
      # s3Key       : String   -> S3 path of the file
      # status      : String   -> UPLOADED / PROCESSING / COMPLETED / FAILED / DELETED
      # deletedAt   : String   -> Deletion timestamp (optional)

