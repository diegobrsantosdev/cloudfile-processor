AWSTemplateFormatVersion: '2010-09-09'
Description: S3 buckets for MVP file storage.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-input-${AWS::AccountId}-${EnvironmentName}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !ImportValue file-processor-sqs-dev-QueueArn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/

      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-input"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-output-${AWS::AccountId}-${EnvironmentName}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-output"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-app-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 - Input Bucket
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${InputBucket.Arn}/input/*"

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${InputBucket.Arn}/*"

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt InputBucket.Arn

              # S3 - Output Bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:CopyObject
                Resource: !Sub "${OutputBucket.Arn}/*"

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt OutputBucket.Arn

              # SQS
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !ImportValue file-processor-sqs-dev-QueueArn

              # DynamoDB
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !ImportValue file-processor-dynamodb-dev-FilesTableArn

Outputs:
  InputBucketName:
    Description: Input bucket name
    Value: !Ref InputBucket
    Export:
      Name: !Sub "${AWS::StackName}-InputBucketName"

  OutputBucketName:
    Description: Output bucket name
    Value: !Ref OutputBucket
    Export:
      Name: !Sub "${AWS::StackName}-OutputBucketName"

  InputBucketArn:
    Description: Input bucket ARN
    Value: !GetAtt InputBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-InputBucketArn"

  OutputBucketArn:
    Description: Output bucket ARN
    Value: !GetAtt OutputBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OutputBucketArn"

  AppRoleArn:
    Description: Application role ARN
    Value: !GetAtt AppRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AppRoleArn"