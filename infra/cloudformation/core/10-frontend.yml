AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Front-end hosting for Cloudfile Processor.
  A single CloudFront distribution serves the Angular app from a private S3 bucket
  and forwards /api/* to the Application Load Balancer, so the browser only talks
  to one HTTPS origin (no mixed content, no CORS for the API).
  Deployed after the ALB stack and before Cognito/S3, which receive the CloudFront URL.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Mappings:
  # AWS managed CloudFront policies (fixed IDs, same in every account)
  ManagedPolicies:
    CachePolicy:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6

Resources:

  # ── S3 BUCKET (private, only CloudFront can read it) ──
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${EnvironmentName}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-frontend"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-frontend-oac"
        Description: Lets CloudFront read the private front-end bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ── SPA ROUTING ──
  # Angular routes (/files, /admin...) do not exist as files in S3.
  # Requests without a file extension are rewritten to /index.html.
  # A function is used instead of custom error pages, which would also
  # replace real 403/404 responses coming from the API.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrites Angular routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # ── API CACHE POLICY ──
  # Nothing is cached by CloudFront (default TTL 0); the Authorization header
  # is part of the cache key so it is always forwarded to the API.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-api-no-cache"
        Comment: No caching, forwards the Authorization header to the API
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Authorization
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # ── API ORIGIN REQUEST POLICY ──
  # Forwards every viewer header to the API except:
  #   - Host: the ALB expects its own host name.
  #   - Origin: browsers send it on POST/DELETE even for same-origin calls.
  #     Behind CloudFront the API sees the ALB host, so Spring would treat the
  #     CloudFront origin as cross-origin and reject the request (CORS 403).
  #     For the browser everything is one origin, so there is no real CORS here.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-api-origin-request"
        Comment: All viewer headers except Host and Origin
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - Host
            - Origin
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  # ── DISTRIBUTION ──
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName}-${EnvironmentName} front-end and API"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-alb
            DomainName:
              Fn::ImportValue: !Sub "${ProjectName}-alb-${EnvironmentName}-LoadBalancerDNSName"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, CachePolicy, CachingOptimized]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-alb
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  FrontendBucketName:
    Description: Bucket that holds the Angular build
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"

  DistributionId:
    Description: CloudFront distribution ID (used to invalidate the cache)
    Value: !Ref Distribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  DistributionDomainName:
    Description: CloudFront domain name
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-DistributionDomainName"

  FrontendUrl:
    Description: Public URL of the application
    Value: !Sub "https://${Distribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-FrontendUrl"

