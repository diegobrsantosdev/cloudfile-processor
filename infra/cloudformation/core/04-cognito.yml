AWSTemplateFormatVersion: '2010-09-09'
Description: User Pool, App Client, and Domain for the file storage system MVP.

Parameters:

  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  CallbackUrl:
    Type: String
    Default: http://localhost:8080/login

  LogoutUrl:
    Type: String
    Default: http://localhost:8080/logout

Resources:

  MyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${EnvironmentName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationLambda.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName
        ManagedBy: cloudformation

  MyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-${EnvironmentName}-client"
      UserPoolId: !Ref MyUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60

  MyUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}"
      UserPoolId: !Ref MyUserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref MyUserPool
      Description: Admin users with full access

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: USER
      UserPoolId: !Ref MyUserPool
      Description: Regular users

  PostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoAddUserToGroupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  PostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-post-confirmation"
      Handler: index.lambda_handler
      Role: !GetAtt PostConfirmationLambdaRole.Arn
      Runtime: python3.9
      Code:
        ZipFile: |
          import boto3
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def lambda_handler(event, context):
              client = boto3.client('cognito-idp')
              group_name = 'USER'
              user_pool_id = event['userPoolId']
              user_name = event['userName']
              try:
                  client.admin_add_user_to_group(
                      UserPoolId=user_pool_id,
                      Username=user_name,
                      GroupName=group_name
                  )
                  logger.info(f"User {user_name} successfully added to group {group_name}")
              except Exception as e:
                  logger.error(f"Error adding user to group: {str(e)}")
              return event

  PostConfirmationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationLambda.Arn
      Principal: cognito-idp.amazonaws.com

Outputs:

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MyUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !Ref MyUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoAppClientId"

  CognitoDomain:
    Description: Hosted UI Domain prefix
    Value: !Ref MyUserPoolDomain
    Export:
      Name: !Sub "${AWS::StackName}-CognitoDomain"

  CognitoHostedUiUrl:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${MyUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoHostedUiUrl"

  AdminGroupName:
    Description: Admin group name
    Value: !Ref AdminGroup

  UserGroupName:
    Description: User group name
    Value: !Ref UserGroup

  PostConfirmationLambdaArn:
    Description: ARN of the Post Confirmation Lambda
    Value: !GetAtt PostConfirmationLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PostConfirmationLambdaArn"