AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate cluster for Cloudfile Processor worker and API.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  ApiImageUri:
    Type: String
    Description: ECR image URI for the API

  WorkerImageUri:
    Type: String
    Description: ECR image URI for the Worker

  ApiContainerPort:
    Type: Number
    Default: 8080

Resources:

  # ── CLUSTER ──
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}-cluster"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  # ── LOG GROUPS ──
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}-api"
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}-worker"
      RetentionInDays: 7

  # ── EXECUTION ROLE ──
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ── SECURITY GROUP DO ECS ──
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-network-${EnvironmentName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ApiContainerPort
          ToPort: !Ref ApiContainerPort
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-alb-${EnvironmentName}-ALBSecurityGroupId"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ── TASK DEFINITION — API ──
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-api"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-s3-${EnvironmentName}-AppRoleArn"
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImageUri
          PortMappings:
            - ContainerPort: !Ref ApiContainerPort
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Ref EnvironmentName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  # ── TASK DEFINITION — WORKER ──
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-worker"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-s3-${EnvironmentName}-AppRoleArn"
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImageUri
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Sub "${EnvironmentName},worker"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: worker

  # ── SERVICE — API ──
  ApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-api-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-network-${EnvironmentName}-PrivateSubnetAId"
            - Fn::ImportValue: !Sub "${ProjectName}-network-${EnvironmentName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: !Ref ApiContainerPort
          TargetGroupArn:
            Fn::ImportValue: !Sub "${ProjectName}-alb-${EnvironmentName}-ApiTargetGroupArn"

  # ── SERVICE — WORKER ──
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-worker-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-network-${EnvironmentName}-PrivateSubnetAId"
            - Fn::ImportValue: !Sub "${ProjectName}-network-${EnvironmentName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref EcsSecurityGroup

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ApiServiceName:
    Value: !GetAtt ApiService.Name
    Export:
      Name: !Sub "${AWS::StackName}-ApiServiceName"

  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
    Export:
      Name: !Sub "${AWS::StackName}-WorkerServiceName"