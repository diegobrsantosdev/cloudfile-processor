AWSTemplateFormatVersion: '2010-09-09'
Description: User Pool, App Client, and Domain for the file storage system MVP.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  CallbackUrl:
    Type: String
    Default: http://localhost:8080/login

  LogoutUrl:
    Type: String
    Default: http://localhost:8080/logout

Resources:

  MyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${EnvironmentName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName
        ManagedBy: cloudformation

  MyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-${EnvironmentName}-client"
      UserPoolId: !Ref MyUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60

  MyUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}"
      UserPoolId: !Ref MyUserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref MyUserPool
      Description: Admin users with full access

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: USER
      UserPoolId: !Ref MyUserPool
      Description: Regular users

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MyUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !Ref MyUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoAppClientId"

  CognitoDomain:
    Description: Hosted UI Domain prefix
    Value: !Ref MyUserPoolDomain
    Export:
      Name: !Sub "${AWS::StackName}-CognitoDomain"

  CognitoHostedUiUrl:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${MyUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoHostedUiUrl"

  AdminGroupName:
    Description: Admin group name
    Value: !Ref AdminGroup

  UserGroupName:
    Description: User group name
    Value: !Ref UserGroup