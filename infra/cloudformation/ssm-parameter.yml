AWSTemplateFormatVersion: '2010-09-09'
Description: SSM Parameter Store values for Cloudfile Processor.

Parameters:
  ProjectName:
    Type: String
    Default: file-processor

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  AwsRegion:
    Type: String
    Default: us-east-1

  CallbackUrl:
    Type: String
    Default: http://localhost:8080/login

  LogoutUrl:
    Type: String
    Default: http://localhost:8080/logout

  InputBucketExportName:
    Type: String
    Description: Export name of the input bucket from the S3 stack

  OutputBucketExportName:
    Type: String
    Description: Export name of the output bucket from the S3 stack

  SqsStackName:
    Type: String
    Description: Name of the SQS stack

Resources:
  AwsRegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/aws/region"
      Type: String
      Value: !Ref AwsRegion
      Description: AWS region for the application

  InputBucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/s3/input-bucket-name"
      Type: String
      Value: !ImportValue
        Fn::Sub: "${InputBucketExportName}"
      Description: Input bucket name

  OutputBucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/s3/output-bucket-name"
      Type: String
      Value: !ImportValue
        Fn::Sub: "${OutputBucketExportName}"
      Description: Output bucket name

  CallbackUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/cognito/callback-url"
      Type: String
      Value: !Ref CallbackUrl
      Description: Cognito callback URL

  LogoutUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/cognito/logout-url"
      Type: String
      Value: !Ref LogoutUrl
      Description: Cognito logout URL

  PresignedUrlExpirationMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/s3/presigned-url-expiration-minutes"
      Type: String
      Value: "15"
      Description: Presigned URL expiration time in minutes

  SqsQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/sqs/queue-url"
      Type: String
      Value: !ImportValue
        Fn::Sub: "${SqsStackName}-QueueUrl"
      Description: SQS queue URL for file processing

  CognitoIssuerUriParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/cognito/issuer-uri"
      Type: String
      Value: !Sub
        - "https://cognito-idp.${Region}.amazonaws.com/${UserPoolId}"
        - Region: !Ref AwsRegion
          UserPoolId: !ImportValue file-processor-cognito-dev-CognitoUserPoolId

  CognitoClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/cognito/client-id"
      Type: String
      Value: !ImportValue file-processor-cognito-dev-CognitoAppClientId

  FilesTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/dynamodb/files-table-name"
      Type: String
      Value: !Sub "${ProjectName}-${EnvironmentName}-files"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  FileIdIndexNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/dynamodb/file-id-index-name"
      Type: String
      Value: fileId-index
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  UserIdIndexNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/dynamodb/user-id-index-name"
      Type: String
      Value: UserIdIndex
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

Outputs:
  AwsRegionParameterName:
    Value: !Ref AwsRegionParameter

  InputBucketNameParameterName:
    Value: !Ref InputBucketNameParameter

  OutputBucketNameParameterName:
    Value: !Ref OutputBucketNameParameter

  CallbackUrlParameterName:
    Value: !Ref CallbackUrlParameter

  LogoutUrlParameterName:
    Value: !Ref LogoutUrlParameter

  PresignedUrlExpirationMinutesParameterName:
    Value: !Ref PresignedUrlExpirationMinutesParameter

  SqsQueueUrlParameterName:
    Value: !Ref SqsQueueUrlParameter

  FilesTableNameParameterName:
    Value: !Ref FilesTableNameParameter

  FileIdIndexNameParameterName:
    Value: !Ref FileIdIndexNameParameter

  UserIdIndexNameParameterName:
    Value: !Ref UserIdIndexNameParameter